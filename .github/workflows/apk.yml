name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Put the page inside the app (offline copy)
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/app/index.html android/app/src/main/assets/index.html
          cp docs/app/bakim.html android/app/src/main/assets/bakim.html

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::KEYSTORE_B64 secret is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/release.jks

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build error
        if: failure()
        run: |
          f=android/build.log
          [ -f "$f" ] || exit 0
          msg=$( (grep -A25 "What went wrong" "$f" || tail -40 "$f") | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle::$msg"

      - name: Rename
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk termoform-ogreniyorum.apk
          cp android/app/build/outputs/bundle/release/app-release.aab termoform-ogreniyorum.aab

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Termoform Öğreniyorum 1.0.${{ github.run_number }}
          files: |
            termoform-ogreniyorum.apk
            termoform-ogreniyorum.aab
          make_latest: true
