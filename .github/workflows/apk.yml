name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the page inside the app (offline copy)
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/index.html

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::KEYSTORE_B64 secret is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/release.jks

      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk termoform-ogreniyorum.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Termoform Öğreniyorum 1.0.${{ github.run_number }}
          files: termoform-ogreniyorum.apk
          make_latest: true
