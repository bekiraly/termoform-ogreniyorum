<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body)}

.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-disp);font-weight:700;letter-spacing:.04em;font-size:17px;white-space:nowrap}
.logo img{width:34px;height:34px;border-radius:8px}
.logo span{color:var(--accent)}
[dir=rtl] .logo,[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .btn{font-family:"IBM Plex Sans Arabic",var(--f-disp);letter-spacing:0}
.lang{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:6px 11px;font:600 13px var(--f-disp);cursor:pointer}
.lang button.on{background:var(--accent);color:var(--accentInk)}
/* hero */
.hero{padding-top:56px;padding-bottom:40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
h1{font-family:var(--f-disp);font-size:clamp(32px,5vw,52px);line-height:1.08;margin:0 0 16px;letter-spacing:.01em}

.btn.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn svg{width:20px;height:20px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tag{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 12px}
.tag.red{border-color:var(--red);color:#ff9a9a}
.hero-art{position:relative;aspect-ratio:1/1;max-width:420px;justify-self:center;width:100%}
.hero-art img{width:100%;border-radius:22%;box-shadow:0 30px 80px rgba(0,0,0,.55)}
/* sections */
section{padding:40px 0}
h2{font-family:var(--f-disp);font-size:clamp(24px,3vw,32px);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 22px}
.demo{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.demo iframe{display:block;width:100%;height:min(980px,88vh);border:0;background:var(--bg)}
.demo-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.demo-bar a{color:var(--accent);font-weight:600;text-decoration:none}
.feats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.feat .ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);margin-bottom:10px}
.feat .ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8}
.feat h3{margin:0 0 6px;font-size:17px;font-family:var(--f-disp)}
.feat p{margin:0;color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accentInk);font:700 16px var(--f-disp);margin-bottom:10px}
.step h3{margin:0 0 4px;font-size:17px}
.step p{margin:0;color:var(--muted);font-size:15px}
.ios{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.ios h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:17px}

.ios ol{margin:0;padding-inline-start:22px;font-size:15px;line-height:1.7}
.ios a{color:var(--accent)}
.note{margin-top:14px;font-size:14px;color:var(--muted);background:var(--panel2);border-radius:8px;padding:10px 14px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:28px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
footer a{color:var(--fg)}

  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  const src="app/?lang="+lang, fr=document.getElementById("app");
  if(fr.getAttribute("src")!==src) fr.setAttribute("src",src);
  document.getElementById("full").href=src;
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
setLang(pick());
if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)) {
  const b=document.getElementById("apk"); b.href="#iphone"; b.querySelector("span").dataset.t="iosBtn"; setLang(lang);
}
</script>
</body>
